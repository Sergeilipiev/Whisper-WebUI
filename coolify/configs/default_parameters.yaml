# ====================================================================
# WHISPER-WEBUI - DEFAULT PARAMETERS
# ====================================================================
# Оптимизировано для:
# - RTX 3080 (10GB VRAM)
# - Русский язык
# - Модель: juasker/whisper-ct2-podlodka-turbo
# ====================================================================

whisper:
  # Русская модель с WER 5.22% на Common Voice
  model_size: "juasker/whisper-ct2-podlodka-turbo"
  file_format: "SRT"
  lang: "ru"
  is_translate: false
  beam_size: 5
  log_prob_threshold: -1
  no_speech_threshold: 0.6
  best_of: 5
  patience: 1
  condition_on_previous_text: true
  prompt_reset_on_temperature: 0.5
  initial_prompt: null
  temperature: 0
  compression_ratio_threshold: 2.4
  chunk_length: 30
  # Уменьшен batch_size для 10GB VRAM
  batch_size: 16
  length_penalty: 1
  repetition_penalty: 1
  no_repeat_ngram_size: 0
  prefix: null
  suppress_blank: true
  suppress_tokens: "[-1]"
  max_initial_timestamp: 1
  word_timestamps: true
  prepend_punctuations: "\"'"¿([{-«"
  append_punctuations: "\"'.。,，!！?？:：")]}、»"
  max_new_tokens: null
  hallucination_silence_threshold: null
  hotwords: null
  language_detection_threshold: 0.5
  language_detection_segments: 1
  add_timestamp: false
  # Offload для экономии VRAM
  enable_offload: true

vad:
  # Silero VAD - language-agnostic
  vad_filter: true
  threshold: 0.5
  min_speech_duration_ms: 250
  max_speech_duration_s: 9999
  min_silence_duration_ms: 1000
  speech_pad_ms: 2000

diarization:
  # pyannote 3.1 - language-agnostic
  is_diarize: false
  hf_token: ""
  # Offload для экономии VRAM
  enable_offload: true

bgm_separation:
  is_separate_bgm: false
  # Меньшая модель для 10GB VRAM
  uvr_model_size: "UVR-MDX-NET-Inst_HQ_3"
  segment_size: 256
  save_file: false
  # Offload для экономии VRAM
  enable_offload: true

translation:
  deepl:
    api_key: ""
    is_pro: false
    source_lang: "Automatic Detection"
    target_lang: "English"
  nllb:
    # Меньшая модель для 10GB VRAM (600M вместо 1.3B)
    model_size: "facebook/nllb-200-distilled-600M"
    source_lang: "rus_Cyrl"
    target_lang: "eng_Latn"
    max_length: 200
  add_timestamp: false
